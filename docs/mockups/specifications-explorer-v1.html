const DATA=[{"id": "openspec-change-browser", "title": "Change browser", "purpose": "Provides bb users with a view of OpenSpec changes and their artifacts in the selected project environment without duplicating repository content.", "requirements": [{"title": "Select a Source and Browse Changes", "body": "The plugin SHALL show active and archived changes in the standard OpenSpec structure for the selected project environment, support searching by name and ID, and show whether proposal/specs/design/tasks exist and task progress. When the environment changes, the data SHALL belong only to the new source.", "scenarios": [{"title": "Browse Project Changes", "steps": [{"kind": "WHEN", "text": "the user selects a project and an environment containing openspec/changes"}, {"kind": "THEN", "text": "the plugin shows changes from that environment and lets the user open each one"}]}, {"title": "OpenSpec Is Missing or Unavailable", "steps": [{"kind": "WHEN", "text": "the environment has no OpenSpec directory or reading fails"}, {"kind": "THEN", "text": "the interface shows the appropriate empty state or an error with an option to retry loading"}]}]}, {"title": "View Artifacts", "body": "The plugin SHALL display the selected artifact as Markdown and list specifications by capability. Missing artifacts SHALL be clearly indicated. The plugin MUST restrict reads to the OpenSpec directory of the selected environment.", "scenarios": [{"title": "View Specifications", "steps": [{"kind": "WHEN", "text": "the user opens the Specs for a change with multiple capabilities"}, {"kind": "THEN", "text": "the user can select and read the corresponding spec.md"}]}, {"title": "Invalid Path", "steps": [{"kind": "WHEN", "text": "a request attempts to read a file outside the selected environment's OpenSpec directory"}, {"kind": "THEN", "text": "the plugin rejects the request"}]}]}, {"title": "Refresh External Changes", "body": "The open interface SHALL automatically reread OpenSpec content after changes made by an agent or user, and provide a manual refresh option.", "scenarios": [{"title": "Agent Updates Tasks", "steps": [{"kind": "WHEN", "text": "an agent modifies the open change's tasks.md"}, {"kind": "THEN", "text": "the interface updates the task list and progress without reloading the application"}]}]}], "source": "openspec/specs/openspec-change-browser/spec.md", "markdown": "# openspec-change-browser Specification\n\n## Purpose\nProvides bb users with a view of OpenSpec changes and their artifacts in the selected project environment without duplicating repository content.\n\n## Requirements\n\n### Requirement: Select a Source and Browse Changes\nThe plugin SHALL show active and archived changes in the standard OpenSpec structure for the selected project environment, support searching by name and ID, and show whether proposal/specs/design/tasks exist and task progress. When the environment changes, the data SHALL belong only to the new source.\n\n#### Scenario: Browse Project Changes\n- **WHEN** the user selects a project and an environment containing openspec/changes\n- **THEN** the plugin shows changes from that environment and lets the user open each one\n\n#### Scenario: OpenSpec Is Missing or Unavailable\n- **WHEN** the environment has no OpenSpec directory or reading fails\n- **THEN** the interface shows the appropriate empty state or an error with an option to retry loading\n\n### Requirement: View Artifacts\nThe plugin SHALL display the selected artifact as Markdown and list specifications by capability. Missing artifacts SHALL be clearly indicated. The plugin MUST restrict reads to the OpenSpec directory of the selected environment.\n\n#### Scenario: View Specifications\n- **WHEN** the user opens the Specs for a change with multiple capabilities\n- **THEN** the user can select and read the corresponding spec.md\n\n#### Scenario: Invalid Path\n- **WHEN** a request attempts to read a file outside the selected environment's OpenSpec directory\n- **THEN** the plugin rejects the request\n\n### Requirement: Refresh External Changes\nThe open interface SHALL automatically reread OpenSpec content after changes made by an agent or user, and provide a manual refresh option.\n\n#### Scenario: Agent Updates Tasks\n- **WHEN** an agent modifies the open change's tasks.md\n- **THEN** the interface updates the task list and progress without reloading the application\n", "history": {"id": "add-openspec-task-browser", "date": "2026-10-28", "path": "openspec/changes/archive/2026-10-28-add-openspec-task-browser/specs/openspec-change-browser/spec.md"}}, {"id": "openspec-live-updates", "title": "Live updates", "purpose": "Keeps OpenSpec panels up to date when files and threads change, without periodically accessing the filesystem of an unchanged project.", "requirements": [{"title": "Event-Driven Updates", "body": "OpenSpec data displayed in an open panel SHALL be updated after file events in the selected environment. The plugin MUST NOT periodically scan the directory or reread documents when there are no events or user requests. Frequent events from a single save operation SHALL be coalesced.", "scenarios": [{"title": "Unchanged Project", "steps": [{"kind": "WHEN", "text": "the user leaves the panel open and no files change"}, {"kind": "THEN", "text": "the plugin performs no repeated file reads on a timer"}]}, {"title": "Agent Saves a Task", "steps": [{"kind": "WHEN", "text": "an agent modifies tasks.md"}, {"kind": "THEN", "text": "the plugin updates the status and progress of the corresponding change without reading tasks.md for other changes"}]}]}, {"title": "Shared Watcher and Resource Cleanup", "body": "Panels for the same source SHALL share a watcher. After the last observing panel closes, the plugin SHALL release the watcher and its index. Closing one panel MUST NOT interrupt updates to the others.", "scenarios": [{"title": "Two Panels", "steps": [{"kind": "WHEN", "text": "two panels for the same environment are open and then one is closed"}, {"kind": "THEN", "text": "the remaining panel continues to receive updates through the shared watcher"}]}]}, {"title": "Recovery and Errors", "body": "After missed events, reconnects, and changes to the OpenSpec structure, the plugin SHALL restore the current state. Creation, deletion, and recreation of the directory SHALL be reflected without restarting the plugin. Watch errors SHALL be visible to the user and SHALL allow a manual reread.", "scenarios": [{"title": "Directory Recreated", "steps": [{"kind": "WHEN", "text": "the OpenSpec directory is deleted and then recreated"}, {"kind": "THEN", "text": "the panel first shows that the directory is missing and then shows the new set of changes"}]}]}, {"title": "Thread Updates", "body": "Changes to linked thread states SHALL be reflected through bb events without filesystem scanning.", "scenarios": [{"title": "Agent Finishes a Turn", "steps": [{"kind": "WHEN", "text": "a linked thread becomes idle"}, {"kind": "THEN", "text": "the panel updates its status without rereading tasks from files"}]}]}, {"title": "Consistent Progress and Link Display", "body": "The change list SHALL show task progress proportionally and the state of the linked thread. A saved link SHALL persist when switching between changes and reopening the panel.", "scenarios": [{"title": "Return to a Linked Change", "steps": [{"kind": "WHEN", "text": "the user links a thread, opens another change, and returns"}, {"kind": "THEN", "text": "the original change shows the same linked thread and its current state"}]}, {"title": "Different Progress Levels", "steps": [{"kind": "WHEN", "text": "one change has 8 of 8 tasks completed and another has 1 of 6"}, {"kind": "THEN", "text": "the progress bars show 100% and approximately 17%, with the corresponding counts beside them"}]}]}, {"title": "Compact change list", "body": "The panel SHALL offer a persisted compact mode displaying only change cards, with navigation to details and back. Cards with nonzero task totals and all tasks done SHALL show an explicit completed label and green progress.", "scenarios": [{"title": "Browse compact cards", "steps": [{"kind": "WHEN", "text": "the user enables compact mode and opens a card"}, {"kind": "THEN", "text": "the panel displays that change's details with a return action to the card list"}, {"kind": "AND", "text": "reopening the panel retains the compact mode preference"}]}]}, {"title": "Narrow panel header and active agent animation", "body": "The header SHALL keep project/environment controls and view actions usable at narrow panel widths. An active linked thread SHALL display an animated spinner beside its status, respecting reduced-motion preferences.", "scenarios": [{"title": "Compact narrow panel with working agent", "steps": [{"kind": "WHEN", "text": "a linked thread is active and the panel is 286 pixels wide"}, {"kind": "THEN", "text": "the header controls fit within the panel and the active card shows a spinner beside its working status"}]}, {"title": "Collapsed source controls", "steps": [{"kind": "WHEN", "text": "the panel is opened"}, {"kind": "THEN", "text": "the header shows a compact source summary instead of project/environment selectors"}, {"kind": "AND", "text": "clicking the summary expands selectors, with Escape or another click collapsing them"}, {"kind": "AND", "text": "narrow panels show the project name while the full context remains available in a tooltip"}]}]}], "source": "openspec/specs/openspec-live-updates/spec.md", "markdown": "# openspec-live-updates Specification\n\n## Purpose\nKeeps OpenSpec panels up to date when files and threads change, without periodically accessing the filesystem of an unchanged project.\n\n## Requirements\n\n### Requirement: Event-Driven Updates\nOpenSpec data displayed in an open panel SHALL be updated after file events in the selected environment. The plugin MUST NOT periodically scan the directory or reread documents when there are no events or user requests. Frequent events from a single save operation SHALL be coalesced.\n\n#### Scenario: Unchanged Project\n- **WHEN** the user leaves the panel open and no files change\n- **THEN** the plugin performs no repeated file reads on a timer\n\n#### Scenario: Agent Saves a Task\n- **WHEN** an agent modifies tasks.md\n- **THEN** the plugin updates the status and progress of the corresponding change without reading tasks.md for other changes\n\n### Requirement: Shared Watcher and Resource Cleanup\nPanels for the same source SHALL share a watcher. After the last observing panel closes, the plugin SHALL release the watcher and its index. Closing one panel MUST NOT interrupt updates to the others.\n\n#### Scenario: Two Panels\n- **WHEN** two panels for the same environment are open and then one is closed\n- **THEN** the remaining panel continues to receive updates through the shared watcher\n\n### Requirement: Recovery and Errors\nAfter missed events, reconnects, and changes to the OpenSpec structure, the plugin SHALL restore the current state. Creation, deletion, and recreation of the directory SHALL be reflected without restarting the plugin. Watch errors SHALL be visible to the user and SHALL allow a manual reread.\n\n#### Scenario: Directory Recreated\n- **WHEN** the OpenSpec directory is deleted and then recreated\n- **THEN** the panel first shows that the directory is missing and then shows the new set of changes\n\n### Requirement: Thread Updates\nChanges to linked thread states SHALL be reflected through bb events without filesystem scanning.\n\n#### Scenario: Agent Finishes a Turn\n- **WHEN** a linked thread becomes idle\n- **THEN** the panel updates its status without rereading tasks from files\n\n### Requirement: Consistent Progress and Link Display\nThe change list SHALL show task progress proportionally and the state of the linked thread. A saved link SHALL persist when switching between changes and reopening the panel.\n\n#### Scenario: Return to a Linked Change\n- **WHEN** the user links a thread, opens another change, and returns\n- **THEN** the original change shows the same linked thread and its current state\n\n#### Scenario: Different Progress Levels\n- **WHEN** one change has 8 of 8 tasks completed and another has 1 of 6\n- **THEN** the progress bars show 100% and approximately 17%, with the corresponding counts beside them\n\n### Requirement: Compact change list\nThe panel SHALL offer a persisted compact mode displaying only change cards, with navigation to details and back. Cards with nonzero task totals and all tasks done SHALL show an explicit completed label and green progress.\n\n#### Scenario: Browse compact cards\n- **WHEN** the user enables compact mode and opens a card\n- **THEN** the panel displays that change's details with a return action to the card list\n- **AND** reopening the panel retains the compact mode preference\n\n### Requirement: Narrow panel header and active agent animation\nThe header SHALL keep project/environment controls and view actions usable at narrow panel widths. An active linked thread SHALL display an animated spinner beside its status, respecting reduced-motion preferences.\n\n#### Scenario: Compact narrow panel with working agent\n- **WHEN** a linked thread is active and the panel is 286 pixels wide\n- **THEN** the header controls fit within the panel and the active card shows a spinner beside its working status\n\n#### Scenario: Collapsed source controls\n- **WHEN** the panel is opened\n- **THEN** the header shows a compact source summary instead of project/environment selectors\n- **AND** clicking the summary expands selectors, with Escape or another click collapsing them\n- **AND** narrow panels show the project name while the full context remains available in a tooltip\n", "history": {"id": "watch-openspec-files", "date": "2026-10-28", "path": "openspec/changes/archive/2026-10-28-watch-openspec-files/specs/openspec-live-updates/spec.md"}}, {"id": "openspec-localization", "title": "Localization", "purpose": "Defines language selection and translation of the OpenSpec interface in bb while preserving the original repository content and agent context.", "requirements": [{"title": "Select the Interface Language", "body": "The plugin SHALL provide a language auto/en/ru setting through bb settings. Auto SHALL select a supported language from the current client's navigator.languages and use English when there is no match. Changing the setting or receiving languagechange SHALL update the UI without a reload.", "scenarios": [{"title": "Language Is Selected Automatically", "steps": [{"kind": "WHEN", "text": "the setting is auto and the browser prefers ru-RU"}, {"kind": "THEN", "text": "the interface is in Russian, and English is used for an unsupported set of languages"}]}, {"title": "Switch Without Losing State", "steps": [{"kind": "WHEN", "text": "the user changes the language while a change is open or the first message is being edited"}, {"kind": "THEN", "text": "labels update without resetting the selected change, form, or prompt text"}]}]}, {"title": "Localize Plugin-Owned Messages", "body": "All plugin-owned labels, hints, accessibility labels, and statuses SHALL have en/ru catalogs with matching keys. Cached plugin-owned errors SHALL be localized when displayed. Number and plural formatting SHALL use Intl.", "scenarios": [{"title": "Cached Error and Counts", "steps": [{"kind": "WHEN", "text": "the interface changes from ru to en after a plugin-owned error has been received"}, {"kind": "THEN", "text": "the error is displayed in English without requesting the data again"}, {"kind": "AND", "text": "the forms for counts 1/2/5/21 match the selected locale"}]}]}, {"title": "Content Language Is Independent of the UI", "body": "Changing the UI locale MUST NOT translate repository files, user-provided names, the editable prompt, agent instructions, or external errors. The plugin MUST NOT change document.lang for all of bb.", "scenarios": [{"title": "Content Remains in Its Original Language", "steps": [{"kind": "WHEN", "text": "the English UI displays a Russian specification and user prompt"}, {"kind": "THEN", "text": "the content and prompt text remain unchanged"}]}]}, {"title": "English Starter Template", "body": "New first-message templates and agent launch context SHALL be in English regardless of the UI locale. They SHALL require following the artifact language specified by the project instructions. The text of an already edited prompt MUST NOT be overwritten when the language changes.", "scenarios": [{"title": "Russian UI and English Starter Prompt", "steps": [{"kind": "WHEN", "text": "the user opens the launch form in the Russian UI"}, {"kind": "THEN", "text": "form labels are in Russian, while the new prompt template is in English and preserves repository paths without translation"}]}]}], "source": "openspec/specs/openspec-localization/spec.md", "markdown": "# openspec-localization Specification\n\n## Purpose\nDefines language selection and translation of the OpenSpec interface in bb while preserving the original repository content and agent context.\n\n## Requirements\n\n### Requirement: Select the Interface Language\nThe plugin SHALL provide a language auto/en/ru setting through bb settings. Auto SHALL select a supported language from the current client's navigator.languages and use English when there is no match. Changing the setting or receiving languagechange SHALL update the UI without a reload.\n\n#### Scenario: Language Is Selected Automatically\n- **WHEN** the setting is auto and the browser prefers ru-RU\n- **THEN** the interface is in Russian, and English is used for an unsupported set of languages\n\n#### Scenario: Switch Without Losing State\n- **WHEN** the user changes the language while a change is open or the first message is being edited\n- **THEN** labels update without resetting the selected change, form, or prompt text\n\n### Requirement: Localize Plugin-Owned Messages\nAll plugin-owned labels, hints, accessibility labels, and statuses SHALL have en/ru catalogs with matching keys. Cached plugin-owned errors SHALL be localized when displayed. Number and plural formatting SHALL use Intl.\n\n#### Scenario: Cached Error and Counts\n- **WHEN** the interface changes from ru to en after a plugin-owned error has been received\n- **THEN** the error is displayed in English without requesting the data again\n- **AND** the forms for counts 1/2/5/21 match the selected locale\n\n### Requirement: Content Language Is Independent of the UI\nChanging the UI locale MUST NOT translate repository files, user-provided names, the editable prompt, agent instructions, or external errors. The plugin MUST NOT change document.lang for all of bb.\n\n#### Scenario: Content Remains in Its Original Language\n- **WHEN** the English UI displays a Russian specification and user prompt\n- **THEN** the content and prompt text remain unchanged\n\n### Requirement: English Starter Template\nNew first-message templates and agent launch context SHALL be in English regardless of the UI locale. They SHALL require following the artifact language specified by the project instructions. The text of an already edited prompt MUST NOT be overwritten when the language changes.\n\n#### Scenario: Russian UI and English Starter Prompt\n- **WHEN** the user opens the launch form in the Russian UI\n- **THEN** form labels are in Russian, while the new prompt template is in English and preserves repository paths without translation\n", "history": {"id": "add-plugin-localization", "date": "2026-10-28", "path": "openspec/changes/archive/2026-10-28-add-plugin-localization/specs/openspec-localization/spec.md"}}, {"id": "openspec-store-sources", "title": "Store sources", "purpose": "Defines selection of a local or registered OpenSpec planning source independently of the agent's code environment.", "requirements": [{"title": "Resolve the Source Independently of the Execution Environment", "body": "The plugin SHALL resolve the source on the selected environment's machine through the public OpenSpec JSON CLI. Automatic selection SHALL follow context, including store-only and defaultStore; an explicit store SHALL be passed through --store. An explicit local selection SHALL read openspec/ in the selected environment.", "scenarios": [{"title": "Store-Only Project", "steps": [{"kind": "WHEN", "text": "the project config specifies a registered store and local planning directories are absent"}, {"kind": "THEN", "text": "automatic selection shows the store changes while keeping the code project as the execution environment"}]}, {"title": "Store-Optional Project", "steps": [{"kind": "WHEN", "text": "local planning directories exist and the user explicitly selects a store"}, {"kind": "THEN", "text": "the browser reads the selected store instead of the local source"}]}, {"title": "Missing CLI or Invalid Store", "steps": [{"kind": "WHEN", "text": "the store source cannot be resolved"}, {"kind": "THEN", "text": "the interface shows an error without replacing the selected store with the local source"}, {"kind": "AND", "text": "an ordinary local source with planning directories is available without the CLI"}]}]}, {"title": "Read and Watch the Selected Source", "body": "The plugin SHALL read only artifacts for the selected change within the resolved planning root. Content SHALL be read directly, without invoking the CLI for each file event. Watchers SHALL be shared by planning path and released when the last subscription closes. Manual refresh SHALL repeat discovery and restore watching at the new path.", "scenarios": [{"title": "Shared External Store Changes", "steps": [{"kind": "WHEN", "text": "several environments watch the same store and an agent modifies tasks.md"}, {"kind": "THEN", "text": "the panels receive current progress through a shared watcher"}, {"kind": "AND", "text": "reading the cached list and idle periods do not invoke the CLI"}]}, {"title": "Store Registration Changes", "steps": [{"kind": "WHEN", "text": "the user changes the registration and clicks refresh"}, {"kind": "THEN", "text": "the source is resolved again and watching switches to the current path"}]}]}, {"title": "Link Threads to a Planning Source", "body": "A link SHALL include environmentId, changeId, and the resolved storeId. Identical changeIds from different sources SHALL have independent thread lists. Existing links without storeId SHALL remain local.", "scenarios": [{"title": "Start and Relink Across Sources", "steps": [{"kind": "WHEN", "text": "the user starts or links a thread to a store change"}, {"kind": "THEN", "text": "metadata records the store, the thread panel restores it, and a local change with the same ID does not receive this link"}, {"kind": "AND", "text": "startup reuses the code environment and passes the planning path and --store to the agent"}]}]}, {"title": "Compact Source Selector", "body": "The header SHALL show the current store in its collapsed context, and the expanded selector SHALL offer Auto, the local source, and registered stores. Viewing an external source file SHALL open it on the store host, not relative to the code checkout.", "scenarios": [{"title": "Open a Store Document", "steps": [{"kind": "WHEN", "text": "the user selects a store and opens an artifact"}, {"kind": "THEN", "text": "Markdown and file preview use the store path while the project/environment controls retain the execution context"}]}]}, {"title": "Show Active and Recent Changes First", "body": "The change list SHALL place changes with an active thread first, then sort by artifact mtime in descending order. Alphabetical order SHALL be used only to break ties. Thread statuses and file events SHALL update the order without manual refresh.", "scenarios": [{"title": "New Work Above Older Completed Changes", "steps": [{"kind": "WHEN", "text": "a new change is created or an active agent is linked to it"}, {"kind": "THEN", "text": "it appears above older changes regardless of alphabetical name"}]}]}], "source": "openspec/specs/openspec-store-sources/spec.md", "markdown": "# openspec-store-sources Specification\n\n## Purpose\nDefines selection of a local or registered OpenSpec planning source independently of the agent's code environment.\n\n## Requirements\n\n### Requirement: Resolve the Source Independently of the Execution Environment\nThe plugin SHALL resolve the source on the selected environment's machine through the public OpenSpec JSON CLI. Automatic selection SHALL follow context, including store-only and defaultStore; an explicit store SHALL be passed through --store. An explicit local selection SHALL read openspec/ in the selected environment.\n\n#### Scenario: Store-Only Project\n- **WHEN** the project config specifies a registered store and local planning directories are absent\n- **THEN** automatic selection shows the store changes while keeping the code project as the execution environment\n\n#### Scenario: Store-Optional Project\n- **WHEN** local planning directories exist and the user explicitly selects a store\n- **THEN** the browser reads the selected store instead of the local source\n\n#### Scenario: Missing CLI or Invalid Store\n- **WHEN** the store source cannot be resolved\n- **THEN** the interface shows an error without replacing the selected store with the local source\n- **AND** an ordinary local source with planning directories is available without the CLI\n\n### Requirement: Read and Watch the Selected Source\nThe plugin SHALL read only artifacts for the selected change within the resolved planning root. Content SHALL be read directly, without invoking the CLI for each file event. Watchers SHALL be shared by planning path and released when the last subscription closes. Manual refresh SHALL repeat discovery and restore watching at the new path.\n\n#### Scenario: Shared External Store Changes\n- **WHEN** several environments watch the same store and an agent modifies tasks.md\n- **THEN** the panels receive current progress through a shared watcher\n- **AND** reading the cached list and idle periods do not invoke the CLI\n\n#### Scenario: Store Registration Changes\n- **WHEN** the user changes the registration and clicks refresh\n- **THEN** the source is resolved again and watching switches to the current path\n\n### Requirement: Link Threads to a Planning Source\nA link SHALL include environmentId, changeId, and the resolved storeId. Identical changeIds from different sources SHALL have independent thread lists. Existing links without storeId SHALL remain local.\n\n#### Scenario: Start and Relink Across Sources\n- **WHEN** the user starts or links a thread to a store change\n- **THEN** metadata records the store, the thread panel restores it, and a local change with the same ID does not receive this link\n- **AND** startup reuses the code environment and passes the planning path and --store to the agent\n\n### Requirement: Compact Source Selector\nThe header SHALL show the current store in its collapsed context, and the expanded selector SHALL offer Auto, the local source, and registered stores. Viewing an external source file SHALL open it on the store host, not relative to the code checkout.\n\n#### Scenario: Open a Store Document\n- **WHEN** the user selects a store and opens an artifact\n- **THEN** Markdown and file preview use the store path while the project/environment controls retain the execution context\n\n### Requirement: Show Active and Recent Changes First\nThe change list SHALL place changes with an active thread first, then sort by artifact mtime in descending order. Alphabetical order SHALL be used only to break ties. Thread statuses and file events SHALL update the order without manual refresh.\n\n#### Scenario: New Work Above Older Completed Changes\n- **WHEN** a new change is created or an active agent is linked to it\n- **THEN** it appears above older changes regardless of alphabetical name\n", "history": {"id": "support-openspec-stores", "date": "2026-10-28", "path": "openspec/changes/archive/2026-10-28-support-openspec-stores/specs/openspec-store-sources/spec.md"}}, {"id": "openspec-task-checklist", "title": "Task checklist", "purpose": "Shows OpenSpec task groups and their completion status alongside change artifacts, leaving task-state management to the agent and source files.", "requirements": [{"title": "Read-Only Checklist", "body": "The plugin SHALL display tasks from tasks.md with their groups, the Unicode indicators ✓ and ○, the number of completed tasks, and overall progress. The user MUST NOT change task marks or task content through the plugin. Code blocks MUST NOT be interpreted as real tasks.", "scenarios": [{"title": "Completed and Remaining Tasks", "steps": [{"kind": "WHEN", "text": "tasks.md contains completed and incomplete items"}, {"kind": "THEN", "text": "the interface shows ✓ and ○, correct counts, and no interactive checkboxes"}]}, {"title": "No Tasks Yet", "steps": [{"kind": "WHEN", "text": "tasks.md is missing or contains no trackable tasks"}, {"kind": "THEN", "text": "the interface indicates that there are no tasks and offers to explore the change with an agent"}]}]}], "source": "openspec/specs/openspec-task-checklist/spec.md", "markdown": "# openspec-task-checklist Specification\n\n## Purpose\nShows OpenSpec task groups and their completion status alongside change artifacts, leaving task-state management to the agent and source files.\n\n## Requirements\n\n### Requirement: Read-Only Checklist\nThe plugin SHALL display tasks from tasks.md with their groups, the Unicode indicators ✓ and ○, the number of completed tasks, and overall progress. The user MUST NOT change task marks or task content through the plugin. Code blocks MUST NOT be interpreted as real tasks.\n\n#### Scenario: Completed and Remaining Tasks\n- **WHEN** tasks.md contains completed and incomplete items\n- **THEN** the interface shows ✓ and ○, correct counts, and no interactive checkboxes\n\n#### Scenario: No Tasks Yet\n- **WHEN** tasks.md is missing or contains no trackable tasks\n- **THEN** the interface indicates that there are no tasks and offers to explore the change with an agent\n", "history": {"id": "add-openspec-task-browser", "date": "2026-10-28", "path": "openspec/changes/archive/2026-10-28-add-openspec-task-browser/specs/openspec-task-checklist/spec.md"}}, {"id": "openspec-thread-context", "title": "Thread context", "purpose": "Links OpenSpec changes to bb threads, allowing users to start agent work with the selected change context and return to the associated thread.", "requirements": [{"title": "Start an Agent for a Change", "body": "The plugin SHALL create a visible thread for an active change in the selected project environment. Before sending, the user SHALL choose exploration, implementation, or verification, configure the agent, and edit the first message. The plugin MUST NOT start an agent without an explicit user action. Implementation SHALL be unavailable when there are no tasks.", "scenarios": [{"title": "Start Implementation", "steps": [{"kind": "WHEN", "text": "the user confirms starting implementation of a change that has tasks"}, {"kind": "THEN", "text": "a linked thread is created in the same environment with the selected settings and a message containing the change context"}]}, {"title": "Start Failure", "steps": [{"kind": "WHEN", "text": "thread creation fails"}, {"kind": "THEN", "text": "the form retains its input and shows an error without automatically retrying the launch"}]}]}, {"title": "Links to Existing Threads", "body": "The user SHALL be able to link an existing thread from the same environment to a change, see linked threads with their current statuses, and open them. Linking MUST NOT send a message to the agent. The thread SHALL provide access to the linked change.", "scenarios": [{"title": "Link an Existing Thread", "steps": [{"kind": "WHEN", "text": "the user selects a thread from the same environment and confirms the link"}, {"kind": "THEN", "text": "the thread appears on the change card without starting a new agent turn"}]}, {"title": "Navigate from a Thread", "steps": [{"kind": "WHEN", "text": "the user opens OpenSpec from a linked thread"}, {"kind": "THEN", "text": "the linked change is displayed in that thread's environment"}]}]}], "source": "openspec/specs/openspec-thread-context/spec.md", "markdown": "# openspec-thread-context Specification\n\n## Purpose\nLinks OpenSpec changes to bb threads, allowing users to start agent work with the selected change context and return to the associated thread.\n\n## Requirements\n\n### Requirement: Start an Agent for a Change\nThe plugin SHALL create a visible thread for an active change in the selected project environment. Before sending, the user SHALL choose exploration, implementation, or verification, configure the agent, and edit the first message. The plugin MUST NOT start an agent without an explicit user action. Implementation SHALL be unavailable when there are no tasks.\n\n#### Scenario: Start Implementation\n- **WHEN** the user confirms starting implementation of a change that has tasks\n- **THEN** a linked thread is created in the same environment with the selected settings and a message containing the change context\n\n#### Scenario: Start Failure\n- **WHEN** thread creation fails\n- **THEN** the form retains its input and shows an error without automatically retrying the launch\n\n### Requirement: Links to Existing Threads\nThe user SHALL be able to link an existing thread from the same environment to a change, see linked threads with their current statuses, and open them. Linking MUST NOT send a message to the agent. The thread SHALL provide access to the linked change.\n\n#### Scenario: Link an Existing Thread\n- **WHEN** the user selects a thread from the same environment and confirms the link\n- **THEN** the thread appears on the change card without starting a new agent turn\n\n#### Scenario: Navigate from a Thread\n- **WHEN** the user opens OpenSpec from a linked thread\n- **THEN** the linked change is displayed in that thread's environment\n", "history": {"id": "add-openspec-task-browser", "date": "2026-10-28", "path": "openspec/changes/archive/2026-10-28-add-openspec-task-browser/specs/openspec-thread-context/spec.md"}}, {"id": "plugin-distribution", "title": "Distribution", "purpose": "Defines reproducible checks for installing the plugin from Git and release-maintenance documentation without automatic publication.", "requirements": [{"title": "Git installation build verification", "body": "The repository SHALL provide a local build check using the same dependency-installation flags as bb's Git installation.", "scenarios": [{"title": "Production dependencies only", "steps": [{"kind": "WHEN", "text": "a maintainer runs the check"}, {"kind": "THEN", "text": "the build runs in a temporary copy without devDependencies, optionalDependencies, or install scripts"}, {"kind": "AND", "text": "the working node_modules and installed plugin are preserved"}, {"kind": "AND", "text": "the temporary copy is deleted after completion"}]}]}, {"title": "Release preparation without publication", "body": "The documentation SHALL describe Git installation and future release actions separately from local checks.", "scenarios": [{"title": "Repository URL is not yet known", "steps": [{"kind": "WHEN", "text": "local preparation is complete"}, {"kind": "THEN", "text": "the documentation identifies source details that have not yet been filled in"}, {"kind": "AND", "text": "automated checks do not create tags, push, or publish the package"}]}]}], "source": "openspec/specs/plugin-distribution/spec.md", "markdown": "# plugin-distribution Specification\n\n## Purpose\nDefines reproducible checks for installing the plugin from Git and release-maintenance documentation without automatic publication.\n\n## Requirements\n\n### Requirement: Git installation build verification\nThe repository SHALL provide a local build check using the same dependency-installation flags as bb's Git installation.\n\n#### Scenario: Production dependencies only\n- **WHEN** a maintainer runs the check\n- **THEN** the build runs in a temporary copy without devDependencies, optionalDependencies, or install scripts\n- **AND** the working node_modules and installed plugin are preserved\n- **AND** the temporary copy is deleted after completion\n\n### Requirement: Release preparation without publication\nThe documentation SHALL describe Git installation and future release actions separately from local checks.\n\n#### Scenario: Repository URL is not yet known\n- **WHEN** local preparation is complete\n- **THEN** the documentation identifies source details that have not yet been filled in\n- **AND** automated checks do not create tags, push, or publish the package\n", "history": {"id": "prepare-git-distribution", "date": "2026-10-28", "path": "openspec/changes/archive/2026-10-28-prepare-git-distribution/specs/plugin-distribution/spec.md"}}];
const DEMO_CAP='openspec-change-browser';
let comparison='compare',showDemo=true;
const TREE=[{id:'core',description:'Shared services and infrastructure',caps:['openspec-live-updates','openspec-store-sources','openspec-localization','plugin-distribution']},{id:'change-management',description:'Changes, tasks and agent threads',caps:['openspec-change-browser','openspec-task-checklist','openspec-thread-context']},{id:'capability-management',description:'Specification exploration and projections',caps:[]}];
const IMPACT=new Set(['openspec-change-browser','openspec-live-updates']);
let mode='overview',selected='openspec-localization',reqIndex=0,query='';
const colors=['#487faf','#6a84ad','#8a72ae','#4e9c91','#bb8750','#728e56','#8b819c'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const matches=c=>[c.title,c.id,c.purpose,...(mode==='proposed'?proposed(c):c.requirements).flatMap(r=>[r.title,r.body,...r.scenarios.map(s=>s.title)])].join(' ').toLowerCase().includes(query);
const current=()=>DATA.find(c=>c.id===selected);
const proposed=c=>c.id==='openspec-live-updates'?c.requirements.map((r,i)=>i?{...r,operation:'UNCHANGED'}:{...r,operation:'MODIFIED',before:r.body,body:r.body+' A specification preview SHALL refresh when its main specification or selected delta changes.'}):c.id!==DEMO_CAP?c.requirements.map(r=>({...r,operation:'UNCHANGED'})):[...c.requirements.map((r,i)=>i!==1?{...r,operation:'UNCHANGED'}:{...r,operation:'MODIFIED',before:r.body,body:r.body+" The user SHALL be able to inspect a selected change's delta alongside the current specification."}),{title:'Preview a change without syncing',operation:'ADDED',body:'The plugin SHALL provide a read-only preview of a selected change applied to the current main specification. Previewing MUST NOT write to the repository.',scenarios:[{title:'Read the proposed specification',steps:[{kind:'WHEN',text:'the user selects an unarchived change'},{kind:'THEN',text:'the panel marks added and modified requirements and shows the proposed content'},{kind:'AND',text:'the main specification files remain unchanged'}]}]}];
const scenarios=c=>c.requirements.reduce((n,r)=>n+r.scenarios.length,0);
const body=s=>esc(s).replace(/\b(SHALL|MUST)( NOT)?\b/g,'<span class="keyword">$1$2</span>');
const short=s=>s.replace(/^openspec-/,'');
function caps(){return `<section class="caps"><p class="col-label">Capabilities</p>${DATA.filter(matches).map(c=>`<button class="cap-row ${c.id===selected?'active':''}" data-cap="${c.id}">${esc(c.title)}<span>${c.requirements.length}${mode==='proposed'&&c.id===DEMO_CAP?' → '+proposed(c).length:''} requirement${c.requirements.length===1?'':'s'}</span></button>`).join('')}</section>`}
function render(){
 const list=DATA.filter(matches); if(list.length&&!list.some(c=>c.id===selected)){selected=list[0].id;reqIndex=0}
 const c=current();reqIndex=Math.min(reqIndex,(mode==='proposed'?proposed(c):c.requirements).length-1);
 document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));
 document.getElementById('totals').textContent=`${DATA.length} capabilities · ${DATA.reduce((n,c)=>n+c.requirements.length,0)} requirements · ${DATA.reduce((n,c)=>n+scenarios(c),0)} scenarios`;
 document.getElementById('scope').textContent=mode==='history'?'Archived deltas':mode==='proposed'?'Demonstration overlay':'Current specification';
 let html='';
 if(!list.length){html='<div class="empty">No matching specifications.</div>'}
 else if(mode==='overview'){
 html=`<div class="map-context"><span class="small">Proposed hierarchy · source files have not moved</span><label><input type="checkbox" id="demo-activity" ${showDemo?'checked':''}> Example activity</label></div>${showDemo?`<button class="work-summary" data-mode="proposed"><span class="work-dot"></span><span><b>browse-main-specifications</b><small>Preview current specs with a pending change</small></span><span class="work-summary-count">1 change · 1 agent working ↗</span></button>`:'<div class="no-work">No active changes in this repository.</div>'}<div class="domain-grid">${TREE.map((group,gi)=>{const members=group.caps.map(id=>DATA.find(c=>c.id===id)).filter(matches);if(query&&!members.length)return '';const reqs=members.reduce((n,c)=>n+c.requirements.length,0),affected=showDemo&&members.some(c=>IMPACT.has(c.id));return `<section class="domain" style="--tone:${colors[gi]}"><details open class="domain-branch"><summary><span class="domain-title">${esc(group.id)}</span>${affected?'<span class="domain-active">1 active change</span>':`<span class="domain-count">${members.length} specs</span>`}</summary><p class="domain-purpose">${esc(group.description)}</p><div class="domain-meta">${members.length} current specs · ${reqs} requirements</div><div class="domain-children">${members.map(c=>{const active=showDemo&&IMPACT.has(c.id);return `<button class="spec-node ${active?'affected':''}" data-map-cap="${c.id}"><div class="node-top"><span class="node-mark">▤</span><b>${esc(c.title)}</b>${active?'<span class="working-dot" aria-label="Example agent working"></span>':''}</div><div class="node-counts">${c.requirements.length} requirement${c.requirements.length===1?'':'s'} · ${scenarios(c)} scenarios</div>${active?`<div class="impact-line"><span>${c.id===DEMO_CAP?'+1 added · ~1 modified':'~1 modified'}</span><span>Agent working</span></div>`:'<div class="node-quiet">No active changes</div>'}</button>`}).join('')}${group.id==='capability-management'?'<div class="planned-node"><b>Specification explorer</b><span>Planned · navigation and hierarchy</span></div><div class="planned-node"><b>Change projection</b><span>Planned · current + proposed</span></div>':''}</div></details></section>`}).join('')}</div><div class="note">↳ Parent badges count unique changes; one change can affect several branches. Select an active node to inspect its projected specification.</div>`;
 }else if(mode==='structure'||mode==='proposed'){
 const requirements=mode==='proposed'?proposed(c):c.requirements;
 const r=requirements[reqIndex];html=`${mode==='proposed'?'<div class="change-banner"><div><b>browse-main-specifications</b><span>Example draft · not a repository change</span></div><div class="delta-count">+1 added &nbsp; ~2 modified</div></div>':''}<div class="structure"><svg class="wires" aria-hidden="true"></svg>${caps()}<section><p class="col-label">Requirements / ${esc(c.title)}</p><div class="req-list">${requirements.map((r,i)=>`<button class="req-row ${i===reqIndex?'active':''}" data-req="${i}"><b>${String(i+1).padStart(2,'0')}${mode==='proposed'&&r.operation!=='UNCHANGED'?' · '+r.operation:''}</b>${esc(r.title)}<small>${r.scenarios.length} scenario${r.scenarios.length===1?'':'s'}</small></button>`).join('')}</div></section><section class="reader"><p class="col-label">Selected requirement</p><h2>${esc(r.title)}</h2>${mode==='proposed'&&r.operation!=='UNCHANGED'?`<div class="operation ${r.operation.toLowerCase()}">${r.operation}</div>`:''}${mode==='proposed'&&r.operation==='MODIFIED'?`<div class="compare-switch"><button data-compare="current" aria-pressed="${comparison==='current'}">Current</button><button data-compare="proposed" aria-pressed="${comparison==='proposed'}">With change</button><button data-compare="compare" aria-pressed="${comparison==='compare'}">Compare</button></div>${comparison!=='proposed'?`<div class="comparison before"><span>Current</span><p class="body-text">${body(r.before)}</p></div>`:''}${comparison!=='current'?`<div class="comparison after"><span>With change</span><p class="body-text">${body(r.before)} <ins>${body(r.body.slice(r.before.length).trim())}</ins></p></div>`:''}`:`<p class="body-text">${body(r.body)}</p>`}${r.scenarios.map(s=>`<details open><summary>${esc(s.title)}</summary>${s.steps.map(step=>`<div class="step"><b>${step.kind}</b><span>${esc(step.text)}</span></div>`).join('')}</details>`).join('')}<div class="source-line"><span class="small">${esc(short(c.id))}/spec.md</span><button class="link" data-source>View current source ↗</button></div></section></div><div class="note">↳ Lines show containment: capability → requirement → scenario. ${mode==='proposed'?'The preview does not write to main specs.':'No dependencies are inferred.'}</div>`;
 }else{
 html=`<div class="history">${caps()}<section><p class="col-label">History / ${esc(c.title)}</p><p class="sub">The archived delta that introduced these requirements.</p><div class="timeline"><article class="event"><span class="small">${c.history.date}</span><h2>${esc(c.history.id.replaceAll('-',' '))}</h2><p class="body-text"><span class="badge">Archived</span> &nbsp; ${c.requirements.length} added requirements</p>${c.requirements.map((r,i)=>`<div class="delta"><span class="badge">ADDED</span><button class="link" data-history-req="${i}">${esc(r.title)} ↗</button></div>`).join('')}<div class="history-foot"><button class="link" data-mode="structure">Read current specification →</button></div></article></div></section></div><div class="note">↳ No active changes in this repository. This view shows archived delta operations, not test results or approval.</div>`;
 }
 document.getElementById('content').innerHTML=html;requestAnimationFrame(draw);
}
function draw(){const svg=document.querySelector('.wires');if(!svg)return;const root=svg.getBoundingClientRect(),cap=document.querySelector('.cap-row.active');if(!cap)return;let paths=[];const cr=cap.getBoundingClientRect();document.querySelectorAll('.req-row').forEach((el,i)=>{const r=el.getBoundingClientRect(),x1=cr.right-root.left,y1=cr.top+cr.height/2-root.top,x2=r.left-root.left,y2=r.top+r.height/2-root.top;paths.push(`<path class="wire ${i===reqIndex?'selected':''}" d="M${x1},${y1} C${x1+11},${y1} ${x2-11},${y2} ${x2},${y2}"/>`)});const req=document.querySelector('.req-row.active'),reader=document.querySelector('.reader');if(req&&reader){const r=req.getBoundingClientRect(),d=reader.getBoundingClientRect(),x1=r.right-root.left,y1=r.top+r.height/2-root.top,x2=d.left-root.left,y2=d.top+22-root.top;paths.push(`<path class="wire selected" d="M${x1},${y1} C${x1+11},${y1} ${x2-11},${y2} ${x2},${y2}"/>`)}svg.innerHTML=paths.join('')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mode){mode=b.dataset.mode;if(mode==='proposed'){selected=DEMO_CAP;reqIndex=1}render()}else if(b.dataset.mapCap){selected=b.dataset.mapCap;reqIndex=selected===DEMO_CAP?1:0;mode=showDemo&&IMPACT.has(selected)?'proposed':'structure';render()}else if(b.dataset.open){selected=b.dataset.open;reqIndex=0;mode='structure';render()}else if(b.dataset.compare){comparison=b.dataset.compare;render()}else if(b.dataset.cap){selected=b.dataset.cap;reqIndex=0;render()}else if(b.dataset.req!==undefined){reqIndex=Number(b.dataset.req);render()}else if(b.dataset.historyReq!==undefined){reqIndex=Number(b.dataset.historyReq);mode='structure';render()}else if(b.hasAttribute('data-source')){document.getElementById('source-path').textContent=current().source;document.getElementById('source-text').textContent=current().markdown;document.getElementById('source').classList.remove('hidden');document.getElementById('close-source').focus()}});
document.addEventListener('change',e=>{if(e.target.id==='demo-activity'){showDemo=e.target.checked;render()}});
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.toLowerCase().trim();render()});
function closeSource(){document.getElementById('source').classList.add('hidden');document.querySelector('[data-source]')?.focus()}
document.getElementById('close-source').onclick=closeSource;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSource()});window.addEventListener('resize',draw);render();
</script></html>
