<style>
*{box-sizing:border-box}body{margin:0;font:13px var(--font-sans,system-ui,-apple-system,sans-serif);color:var(--foreground,#ececf2);--bg:var(--card,#202027);--recess:var(--surface-recessed,#19191f);--line:var(--border,#36363e);--dim:var(--muted-foreground,#a1a1ae);--purple:var(--brand,#b6a1ff);--green:var(--success,#69c7a3)}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button,select{border:1px solid var(--line);border-radius:8px;background:transparent;padding:7px 10px}button:hover{background:color-mix(in srgb,var(--purple) 9%,transparent)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--purple);outline-offset:2px}button:disabled{opacity:.4;cursor:default}input,textarea{background:var(--recess);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%}.eyebrow{text-transform:uppercase;letter-spacing:1.7px;font-size:10px;color:var(--dim)}.pre{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px;gap:12px}.pre span:last-child{font-size:11px;color:var(--dim)}.app{background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden}.top{display:flex;gap:12px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.logo{width:32px;height:32px;display:grid;place-items:center;background:color-mix(in srgb,var(--purple) 13%,transparent);color:var(--purple);border-radius:9px;font-size:20px}.title{font-size:16px;font-weight:650;letter-spacing:-.4px}.sub{color:var(--dim);font-size:10px;margin-top:3px}.env{margin-left:auto;font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:6px 8px}.workspace{display:grid;grid-template-columns:210px minmax(0,1fr)}aside{padding:16px 12px;background:var(--recess);border-right:1px solid var(--line)}.nav{display:flex;gap:5px;margin-bottom:14px}.nav button{flex:1;font-size:11px;border:0;color:var(--dim);padding:7px}.nav button[aria-pressed=true]{background:var(--bg);color:var(--purple);box-shadow:0 1px 4px #0001}#search{font-size:11px;background:var(--bg);margin-bottom:18px}.section-name{display:flex;justify-content:space-between;color:var(--dim);font-size:10px;margin:0 6px 8px}.change{width:100%;padding:13px 11px;text-align:left;margin:3px 0;border-color:transparent;position:relative}.change[aria-pressed=true]{border-color:color-mix(in srgb,var(--purple) 28%,var(--line));background:color-mix(in srgb,var(--purple) 8%,var(--bg))}.change[aria-pressed=true]:before{content:'';position:absolute;left:-1px;top:16px;bottom:16px;background:var(--purple);width:3px;border-radius:3px}.change strong{display:block;font-size:12px;line-height:1.5;font-weight:550}.change small{display:block;color:var(--dim);font-size:9px;margin:5px 0 10px;overflow-wrap:anywhere}.change-foot{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);align-items:center}.dots{display:flex;gap:3px}.dots i{width:13px;height:3px;border-radius:2px;background:var(--line)}.dots i.yes{background:var(--green)}main{padding:23px 22px;min-width:0}.breadcrumb{font:9px var(--font-mono,monospace);color:var(--dim);overflow-wrap:anywhere}.hero{display:flex;align-items:center;gap:12px;margin:16px 0}.hero h1{font-size:23px;letter-spacing:-.8px;line-height:1.2;font-weight:650;margin:0 0 8px}.state{font-size:10px;color:var(--purple);display:inline-flex;align-items:center;gap:5px}.state:before{content:'';width:5px;height:5px;background:currentColor;border-radius:50%}.ring{flex-shrink:0;width:52px;height:52px;display:grid;place-items:center;position:relative;margin-left:auto}.ring svg{position:absolute;inset:0;transform:rotate(-90deg);width:52px;height:52px}.ring span{font-size:12px;font-weight:600}.summary{line-height:1.7;font-size:12px;color:var(--dim);margin:0 0 18px}.actions{display:flex;gap:7px;flex-wrap:wrap}.primary{background:var(--purple);color:var(--primary-foreground,#17131f);border-color:transparent;font-weight:600}.primary:hover{background:color-mix(in srgb,var(--purple) 85%,white)}.actions button{font-size:11px}.artifact-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:23px 0}.artifact{padding:11px 7px;text-align:left;background:var(--recess);min-width:0}.artifact .icon{color:var(--green);font-size:14px;display:block;margin-bottom:10px}.artifact b{font-size:10px;display:block;font-weight:550}.artifact small{font-size:9px;color:var(--dim);display:block;margin-top:3px}.artifact.missing{opacity:.6}.artifact.missing .icon{color:var(--dim)}.tabs{display:flex;gap:19px;border-bottom:1px solid var(--line);margin-bottom:17px}.tabs button{font-size:11px;border:0;border-radius:0;padding:0 0 11px;color:var(--dim)}.tabs button[aria-selected=true]{color:var(--purple);border-bottom:2px solid var(--purple)}.tabs em{font-style:normal;font-size:9px;padding:2px 5px;background:var(--recess);border-radius:4px;margin-left:4px}.group-title{display:flex;align-items:center;gap:8px;font-size:11px;margin:17px 0 7px}.group-title .index{color:var(--dim);font:9px var(--font-mono,monospace)}.group-title small{margin-left:auto;color:var(--dim);font-size:10px}.task{display:flex;align-items:start;gap:9px;padding:10px 0;font-size:11px;line-height:1.6}.task+.task{border-top:1px solid color-mix(in srgb,var(--line) 50%,transparent)}.task-status{width:16px;flex-shrink:0;text-align:center;font-size:16px;line-height:1.1;margin-top:1px;color:var(--dim)}.task-status.complete{color:var(--purple)}.task.done>span:last-child{color:var(--dim)}.task code{font-size:9px;color:var(--dim);margin-right:5px}.run-card{padding:13px;background:var(--recess);border:1px solid var(--line);border-radius:9px;margin-top:21px;display:flex;gap:10px;align-items:center}.avatar{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--purple) 13%,transparent);color:var(--purple)}.run-card strong{font-size:11px;font-weight:550}.run-card small{font-size:9px;color:var(--dim);display:block;margin-top:4px}.run-card button{margin-left:auto;border:0}.hint{font-size:10px;color:var(--dim);line-height:1.7;margin-top:16px}#notice{font-size:11px;color:var(--purple);padding:10px 0;min-height:35px}dialog{width:min(460px,calc(100% - 24px));padding:23px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:inherit;max-height:90vh;overflow:auto}dialog::backdrop{background:#09090e99;backdrop-filter:blur(4px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.dialog-head h2{font-size:20px;letter-spacing:-.5px;margin:0}.dialog-head button{border:0;font-size:18px}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:18px 0}.modes button{text-align:left;padding:12px 8px;font-size:11px}.modes button small{display:block;font-size:9px;color:var(--dim);margin-top:5px}.modes button[aria-pressed=true]{border-color:var(--purple);background:color-mix(in srgb,var(--purple) 9%,transparent)}.field{display:block;font-size:10px;color:var(--dim);margin:14px 0 6px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pair select{width:100%;font-size:11px;background:var(--recess)}textarea{height:130px;resize:vertical;font-size:11px;line-height:1.7}.dialog-foot{display:flex;justify-content:flex-end;gap:7px;margin-top:18px}.context{padding:10px;border-radius:7px;background:var(--recess);font-size:10px;line-height:1.7;color:var(--dim);margin-top:14px}.doc{font-size:12px;line-height:1.8}.doc h3{font-size:14px}.doc code{font-size:10px;color:var(--purple)}[hidden]{display:none!important}@media(max-width:560px){.workspace{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}#changes{display:flex;overflow:auto;gap:6px}.change{flex:0 0 180px}.section-name{display:none}#search{margin-bottom:8px}.nav{margin-bottom:8px}main{padding:20px 16px}.env{max-width:130px}.artifact-grid{margin:18px 0}.hero h1{font-size:23px}}
</style>
<div class="pre"><span class="eyebrow">Концепция 02 / OpenSpec workspace</span><span>Интерактивное демо</span></div>
<div class="app"><header class="top"><div class="logo">◇</div><div><div class="title">OpenSpec</div><div class="sub">bb-openspec / изменения проекта</div></div><div class="env">⌘ Project checkout</div></header>
<div class="workspace"><aside><div class="nav"><button id="active" aria-pressed="true">Активные · 3</button><button id="archive" aria-pressed="false">Архив · 1</button></div><input id="search" placeholder="⌕ Найти изменение" aria-label="Поиск изменений"><div class="section-name"><span>ИЗМЕНЕНИЯ</span><span>PROGRESS</span></div><div id="changes"></div></aside><main id="detail"></main></div></div>
<div id="notice" role="status"></div>
<dialog id="launch" aria-labelledby="launch-title"><div class="dialog-head"><h2 id="launch-title">Новый тред для change</h2><button id="close" aria-label="Закрыть">×</button></div><div class="breadcrumb" id="launch-change"></div><div class="modes"><button data-mode="explore">◇ Проработать<small>Уточнить артефакты</small></button><button data-mode="apply">↗ Реализовать<small>Выполнить задачи</small></button><button data-mode="verify">✓ Проверить<small>Сверить со specs</small></button></div><div class="pair"><div><label class="field" for="provider">Агент</label><select id="provider"><option>По настройкам bb</option><option>Codex · демо</option><option>Claude Code · демо</option></select></div><div><label class="field" for="execution">Окружение</label><select id="execution"><option>Project checkout</option></select></div></div><label class="field" for="prompt">Первое сообщение · можно изменить</label><textarea id="prompt"></textarea><div class="context" id="context"></div><p class="hint">Новый тред будет связан с этим изменением. Нажатие кнопки отправит первое сообщение агенту.</p><div class="dialog-foot"><button id="cancel">Отмена</button><button class="primary" id="start">↗ Создать и запустить</button></div></dialog>
<script>
const changes=[{id:'add-openspec-task-browser',title:'OpenSpec как задачи в bb',description:'Панель изменений OpenSpec с просмотром артефактов, задач и связанных тредов.',ready:4,groups:[['Чтение и навигация',[['1.1','Найти изменения в выбранном окружении',true],['1.2','Показать артефакты изменения',true]]],['Чеклист и агент',[['2.1','Отображать группы задач и прогресс',false],['2.2','Обновлять прогресс после работы агента',false],['2.3','Запускать тред с контекстом change',false]]]],runs:[]},{id:'refine-workspace-ui',title:'Проработать интерфейс',description:'Согласовать основной экран и поведение карточки изменения до реализации.',ready:1,groups:[],runs:[]},{id:'artifact-preview',title:'Просмотр артефактов',description:'Читать proposal, specs и design рядом с задачами.',ready:4,groups:[['Просмотр',[['1.1','Открывать Markdown',true],['1.2','Показывать specs по capability',true],['1.3','Обрабатывать отсутствующие файлы',true]]]],runs:[]},{id:'2026-10-20-project-setup',title:'Подготовить проект',description:'Архивное изменение. Доступно для просмотра.',ready:4,groups:[['Подготовка',[['1.1','Настроить проект',true]]]],runs:[],archived:true}];
const $=id=>document.getElementById(id);let selected=changes[0],archived=false,tab='tasks',mode='apply';const files=['Proposal','Specs','Design','Tasks'];function stats(c){let t=c.groups.flatMap(g=>g[1]);return {done:t.filter(t=>t[2]).length,total:t.length}}function status(c){let s=stats(c);return c.archived?'В архиве':!s.total?'Подготовка артефактов':s.done===s.total?'Все задачи отмечены':'Есть незавершённые задачи'}function note(s){$('notice').textContent=s}function list(){let found=changes.filter(c=>!!c.archived===archived&&(c.title+' '+c.id).toLowerCase().includes($('search').value.toLowerCase()));$('changes').innerHTML='';found.forEach(c=>{const s=stats(c),b=document.createElement('button');b.className='change';b.setAttribute('aria-pressed',String(c===selected));b.innerHTML='<strong>'+c.title+'</strong><small>'+c.id+'</small><div class="change-foot"><div class="dots">'+files.map((_,i)=>'<i class="'+(i<c.ready?'yes':'')+'"></i>').join('')+'</div><span>'+(s.total?s.done+' / '+s.total:'Нет задач')+'</span></div>';b.onclick=()=>{selected=c;tab='tasks';render()};$('changes').append(b)});if(!found.length)$('changes').textContent='Ничего не найдено'}function render(){list();const c=selected,s=stats(c),pct=s.total?Math.round(s.done/s.total*100):0;$('detail').innerHTML='<div class="breadcrumb">changes / '+c.id+'</div><div class="hero"><div><h1>'+c.title+'</h1><span class="state">'+status(c)+'</span></div><div class="ring" aria-label="Завершено '+pct+' процентов"><svg viewBox="0 0 52 52" fill="none"><circle cx="26" cy="26" r="22" stroke="var(--line)" stroke-width="3"/><circle cx="26" cy="26" r="22" stroke="var(--purple)" stroke-width="3" stroke-linecap="round" stroke-dasharray="'+pct*1.382+' 138.2"/></svg><span>'+pct+'%</span></div></div><p class="summary">'+c.description+'</p><div class="actions"><button id="run" class="primary" '+(c.archived?'disabled':'')+'>↗ Запустить агента</button><button id="link" '+(c.archived?'disabled':'')+'>＋ Привязать тред</button></div><div class="artifact-grid">'+files.map((f,i)=>'<button class="artifact '+(i<c.ready?'':'missing')+'" data-artifact="'+i+'"><span class="icon">'+(i<c.ready?'✓':'○')+'</span><b>'+f+'</b><small>'+(i<c.ready?(i===1?'1 capability':'Файл есть'):'Нет файла')+'</small></button>').join('')+'</div><div class="tabs" role="tablist"><button id="tasks-tab" role="tab" aria-selected="'+(tab==='tasks')+'">Задачи <em>'+s.done+'/'+s.total+'</em></button><button id="runs-tab" role="tab" aria-selected="'+(tab==='runs')+'">Треды <em>'+c.runs.length+'</em></button></div><div id="content" role="tabpanel"></div>';
$('run').onclick=openLaunch;$('link').onclick=()=>note('В плагине здесь будет выбор существующего треда.');document.querySelectorAll('[data-artifact]').forEach(b=>b.onclick=()=>artifact(Number(b.dataset.artifact)));$('tasks-tab').onclick=()=>{tab='tasks';render()};$('runs-tab').onclick=()=>{tab='runs';render()};if(tab==='runs'){renderRuns();return}if(!s.total){$('content').innerHTML='<div class="doc"><h3>Сначала — проработка</h3><p class="summary">В этом изменении ещё нет tasks.md. Агент может помочь уточнить предложение и подготовить спецификации.</p><button id="explore">◇ Проработать с агентом</button></div>';$('explore').onclick=openLaunch;return}c.groups.forEach((g,i)=>{let h=document.createElement('div');h.className='group-title';h.innerHTML='<span class="index">0'+(i+1)+'</span>'+g[0]+'<small>'+g[1].filter(t=>t[2]).length+' / '+g[1].length+'</small>';$('content').append(h);g[1].forEach(t=>{let l=document.createElement('div');l.className='task'+(t[2]?' done':'');let cb=document.createElement('span');cb.className='task-status'+(t[2]?' complete':'');cb.textContent=t[2]?'✓':'○';cb.setAttribute('role','img');cb.setAttribute('aria-label',t[2]?'Выполнено':'Не выполнено');let span=document.createElement('span');span.innerHTML='<code>'+t[0]+'</code>'+t[1];l.append(cb,span);$('content').append(l)})});}
function renderRuns(){if(!selected.runs.length){$('content').innerHTML='<div class="doc"><h3>У этого change пока нет тредов</h3><p class="summary">Запустите агента для проработки, реализации или проверки — его тред появится здесь.</p></div>';return}selected.runs.forEach(r=>{let card=document.createElement('div');card.className='run-card';let avatar=document.createElement('div');avatar.className='avatar';avatar.textContent='↗';let text=document.createElement('div'),strong=document.createElement('strong'),small=document.createElement('small'),button=document.createElement('button');strong.textContent=r.action;small.textContent=r.provider+' · демонстрационный тред';text.append(strong,small);button.textContent='↗';button.setAttribute('aria-label','Открыть тред');button.onclick=()=>note('Это демонстрационный тред. Реальный агент не запущен.');card.append(avatar,text,button);$('content').append(card)})}
function artifact(i){if(i>=selected.ready){note(files[i]+': артефакт пока не создан.');return}$('content').innerHTML='<div class="doc"><div class="eyebrow">'+files[i]+' / демонстрационный документ</div><h3>'+selected.title+'</h3><p>Плагин показывает содержимое артефакта из выбранного checkout. Здесь можно будет читать документ и открыть исходный файл в редакторе bb.</p><code>openspec/changes/'+selected.id+'/'+(i===1?'specs/':files[i].toLowerCase()+'.md')+'</code></div>';document.querySelectorAll('[role=tab]').forEach(t=>t.setAttribute('aria-selected','false'))}
const actions={explore:'Проработать',apply:'Реализовать',verify:'Проверить'};function setMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));const path='openspec/changes/'+selected.id+'/';$('prompt').value=({explore:'Проработай изменение',apply:'Реализуй изменение',verify:'Проверь реализацию изменения'})[m]+' '+selected.id+'.\n\nПрочитай доступные артефакты в '+path+'. '+({explore:'Уточни открытые вопросы и подготовь недостающие артефакты. К реализации пока не переходи.',apply:'Выполняй незавершённые задачи из tasks.md и отмечай выполненные. Если контекста недостаточно, задай вопрос.',verify:'Сопоставь код со specs и задачами. Сообщи о расхождениях и результатах проверок. Файлы не изменяй.'})[m];$('context').textContent='Контекст: bb-openspec · Project checkout · '+selected.id+'. Артефакты: '+files.slice(0,selected.ready).join(', ')+'.';$('start').textContent='↗ Создать и запустить';$('start').disabled=false}
function openLaunch(){$('launch-change').textContent=selected.id;document.querySelector('[data-mode=apply]').disabled=!stats(selected).total;setMode(stats(selected).total?'apply':'explore');$('launch').showModal()}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('close').onclick=$('cancel').onclick=()=>$('launch').close();$('start').onclick=()=>{if(!$('prompt').value.trim()){note('Добавьте первое сообщение для агента.');$('prompt').focus();return}selected.runs.push({action:actions[mode]+' · '+selected.title,provider:$('provider').value,prompt:$('prompt').value});$('launch').close();tab='runs';render();note('Демо: тред добавлен в макет. Реальный агент не запущен.')};$('search').oninput=list;function filter(a){archived=a;selected=changes.find(c=>!!c.archived===a);tab='tasks';$('active').setAttribute('aria-pressed',String(!a));$('archive').setAttribute('aria-pressed',String(a));render()}$('active').onclick=()=>filter(false);$('archive').onclick=()=>filter(true);render();
</script></html>
